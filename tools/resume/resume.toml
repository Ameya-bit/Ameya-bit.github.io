# ---------------------------------------------------------------------------
# THE INVENTORY. One file of facts about Ameya's work; every surface is a view
# of it. It funds the résumé (resume/_body.md and both PDFs, through
# tools/resume/build.py) and the website (the home page timeline and the about
# page, through tools/home/build.py).
#
# Edit THIS file, then:  python3 tools/resume/build.py --pdf
# (The résumé page body and the home page regenerate on every quarto render;
#  only the PDFs need the command.)
#
# THE SHAPE
#   [person]        who: name, headline, the Now paragraph, the about page's
#                   paragraph, profile links
#   [[contact]]     the résumé's contact line, in order
#   [resume]        résumé settings: the variants and which one the page shows
#   [[skills]]      skills rows
#   [[items]]       EVERYTHING ELSE. One item per thing done: a degree, a role,
#                   a study, a project. An item holds
#                     - facts, said once      (id, kind, dates, people, tools)
#                     - one table per surface (how that surface words it)
#                     - its outputs           (posts, papers, repos, links)
#
# ADDING SOMETHING NEW: copy an item, give it a new `id`, fill in the facts.
# It shows nowhere until a surface table says so, so the inventory can hold
# more than any one page has room for. That is the point of it.
#
# ITEM FACTS
#   id        a stable slug. Other items point at it; never reuse one.
#   kind      "education" | "research" | "role" | "teaching" | "project"
#   title     what it was          org       who it was with or for
#   start     "YYYY-MM"            end       "YYYY-MM"; leave out while it runs
#   status    "current" | "ongoing" | "ended". Default: "ended" if there is an
#             `end`, otherwise "current". "ongoing" = open but not active now.
#   parent    the id of the item this one sits under (a study under a research
#             thread). The home page draws children as rows beneath the parent.
#   location, people, team, tools, models     free facts, all optional
#   awards    [{ name, when }]: the CV's Honors & Awards section lists them, in file
#             order; `when` is printed as written ("2026", "Summer 2026")
#   Dates are written ONCE here. Surfaces format them ("Aug – Sep 2026",
#   "Sep 2026 – Present") unless a surface sets its own `dates` string.
#
# [items.resume]  — the résumé's view. No table = not on the résumé.
#   section     which résumé section it files under
#   heading, detail, bullets      the résumé's wording
#   dates       only to override the formatted start/end
#   url         makes the heading a link, on the PDF and the page
#   link_label  names that link's destination in the PDF, which has no hover
#   web_link    "post" | "note": on the PAGE, link to that output of this item
#               instead of `url` (a site-relative link to the write-up)
#   variants    which résumés carry it (default: all). [] = parked: the entry
#               is kept, written and ready, and shown on none of them.
#   [items.resume.<variant>]  keys that replace the entry's own for that
#               variant only (e.g. a shorter bullet list)
#   Within a section, entries appear in the order the items appear below.
#
# [items.home]  — the home page timeline's view, read by tools/home/build.py
#   into _home.md on every render. The page's name, headline, Now paragraph
#   and foot links come from [person]. Eras run newest first; rows keep the
#   order the items have in this file.
#   show    "era"  a node on the road, with name / role / what / tag
#           "row"  a line of work under its parent era, with title / line
#           "more" the same, folded under the era's More toggle
#           "off"  (or no table) not on the home page
#   when    "YYYY-MM": the stamp beside the node, if not the item's `start`
#   An era's own output can be its row: put home = "row" | "more" on the
#   output, with home_title / home_line (see the neutron-star post).
#
# [[items.outputs]]  — what the item produced. Keep these LAST in an item.
#   kind    "post" | "note"  path = its folder on this site. The post's own
#                            front matter stays the truth for its title,
#                            description, date and image; never restate them.
#           "paper"          title, venue, status, role, and for the CV's
#                            Publications: authors (in order), submitted
#           "poster"         url, and for the CV's Presentations: title,
#                            authors (as credited), event, place, date
#           "crosspost" | "demo" | "link"      url (or note)
#           "repo"           name, url, and optionally claim / language /
#                            year: what the code is, in one sentence. There is
#                            no instruments page any more (retired 2026-09-21;
#                            kept at design/backups/). Code is filed under the
#                            work it served, and these fields wait for the
#                            projects page that may replace it.
#
# WRITING CONVENTIONS (build.py translates per surface)
#   " · "  separator      -> \sep in the PDF, middot on the page
#   — and –               -> --- and -- in the PDF, themselves on the page
#   *emphasis*            -> \emph{} in the PDF, <em> on the page
#   χ² (optional " = n")  -> math mode in the PDF, unicode on the page
#   & % # ~               -> escaped for TeX automatically
#
# Lines marked CHECK are facts inferred rather than given. Lines marked REVIEW
# are places where two surfaces currently disagree.
# ---------------------------------------------------------------------------


# ===========================================================================
