# ---------------------------------------------------------------------------
# The résumé's single source of truth. Everything else is generated:
#   resume/_body.md (the site page's body) and the PDF (via template.tex).
# Edit THIS file, then:  python3 tools/resume/build.py --pdf
# (The page body alone regenerates on every quarto render — pre-render hook.)
#
# Writing conventions (build.py translates per surface):
#   " · "  separator      -> \sep in the PDF, middot on the page
#   — and –               -> --- and -- in the PDF, themselves on the page
#   *emphasis*            -> \emph{} in the PDF, <em> on the page
#   χ² (optional " = n")  -> math mode in the PDF, unicode on the page
#   & % #                 -> escaped for TeX automatically
#
# Per-item switches:
#   web = false   on a contact item: PDF-only (the phone number stays off the
#                 public page — the PDF is the subset with the private fields)
#   url           makes the entry heading a link on both surfaces
#   link_label    names that link's destination in the PDF, which has no hover
#   web_url       overrides url on the page (e.g. site-relative post links)
# ---------------------------------------------------------------------------

