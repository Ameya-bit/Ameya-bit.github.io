# ---- primitives: motions composed from cels --------------------------------

[[moves]]
name = "Glide"
group = "primitive"
status = "shipped"
how = "Every stride is one 50 px step, and the wrapper glides to it over 2 s (a CSS transition in the original; a ported per-tick ease in the engine, restart semantics and all). The float is ma5a's signature."
where = "engine/render/renderer.js; config glideTicks"
since = "ma5a's pen; port 16f5340, 2026-07-27"

  [moves.demo]
  h = 1.4
  caption = "Three strides of 50 px, each a 2 s ease-out."
  actors = [
  [
      {at=[16,10], cel="walk", row="side", dx=150, ms=6000},
      {cel="walk", row="side", flip=true, dx=-150, ms=6000},
    ],
  ]

[[moves]]
name = "Scroll walk"
group = "primitive"
status = "live"
how = "The home page's replacement for the glide: the panda's place on the spine is a linear read of scroll position, and the legs run on the 140 ms cel clock only while scrolling continues. Facing follows scroll direction."
where = "assets/home/panda-walk.js"
since = "2026-09-21; legs moved from distance-driven to clock-driven 2026-09-22 after reading as a blur"

  [moves.demo]
