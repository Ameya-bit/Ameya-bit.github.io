# ---------------------------------------------------------------------------
# THE PANDA'S REPERTOIRE. Every movement the hat panda and the troupe have
# ever been given, in one place, so that nothing built is forgotten and the
# home page's animation can be improved against a full list rather than
# whatever is still live. Compiled 2026-09-22 from the shipped code
# (assets/pandas/pandas.js, assets/pandas/engine/), the design docs
# (design/whimsy.md, panda-choreography.md, panda-chaos.md) and git history.
#
# Rendered as the "Panda" section of /colophon/ by tools/home/build.py.
#
# Each [[moves]] entry:
#   name      what it is called
#   group     "cel" (a drawn pose or cycle from the sprite sheet)
#             "primitive" (a motion the code composes from cels)
#             "walker" (the hat panda's own behaviours)
#             "troupe" (an individual roamer's behaviours)
#             "ensemble" (several pandas acting together)
#             "scene" (entrances, tableaux, whole-stage choreography)
#   status    "live"      on the home page today
#             "shipped"   built and working in the engine; not on the page
#             "retired"   built, shipped, then taken off by design review
#             "reverted"  built and rolled back within the day
#             "rejected"  specced and refused before building
#   how       one sentence of mechanics, for whoever rebuilds it
#   where     the file that holds it (or held it)
#   since     the commit or date it landed
#   note      why it went, if it went; anything the next builder should know
#
# The sprite sheet is ma5a's "panda collision" (MIT): 13 columns x 5 facing
# rows (up, diagonal-up, side, diagonal-down, down), left-facing headings
# mirrored in CSS. The straw hat is composited onto columns 0–2 of every row.
# ---------------------------------------------------------------------------

# ---- cels: what the sheet can draw ----------------------------------------

