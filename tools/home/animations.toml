group = "primitive"
status = "live"
how = "A timed 620 ms arc between two live endpoints (the hero stage and the head of the road), scaled 6x to 2x in flight, with a sine lift of 22% of the distance. Runs on a clock so it always lands; reverses in the air if the reader turns back."
where = "assets/home/panda-walk.js (stepJump)"
since = "2026-09-22"
note = "Replaced a scroll-scrubbed shrink-and-walk that could park the panda halfway, standing on the intro paragraph."

