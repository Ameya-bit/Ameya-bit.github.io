project:
  type: website
  output-dir: _site
  # The résumé page's body is generated from tools/resume/resume.toml on every
  # render, so the page can never drift from the source. (The PDF side runs
  # manually: python3 tools/resume/build.py --pdf.)
  pre-render: tools/resume/build.py
  # Figures get their intrinsic width/height and a load policy read out of the
  # image files themselves, after Quarto has written the HTML. Doing it here
  # rather than in the markdown means the numbers cannot drift from the files
  # they describe. (The WebP delivery copies are generated separately and
  # committed: python3 tools/site/figures.py)
  post-render: tools/site/img-attrs.py
  render:
    - "**/*.qmd"
    - "!design/"
  resources:
    - "assets/niche/"
    - "assets/pandas/"
    - "!assets/pandas/engine/node_modules/"

website:
  title: "Ameya Panchal"
  site-url: "https://ameya-bit.github.io"
  description: "Mechanistic interpretability and machine learning notes."
  # A standing panda, cel 0 of the `down` row of the hero sprite sheet, pulled
  # straight out of assets/pandas/engine/render/art-data.js and cropped to its
  # own bounds. Same drawing as the troupe on the homepage, so the tab mark and
  # the site are literally the same artwork — and nothing new had to be drawn.
  favicon: assets/favicon.svg
  # Research circulates as links on X, LessWrong and the Alignment Forum. Without
  # these every share of these posts rendered as a bare URL: no title card, no
  # image, no author — while five publication-grade figures sat in each post
  # unable to be the preview. Both posts already declare `image:` in their
  # front matter, so cards populate immediately.
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search: false
  navbar:
    background: transparent
    title: "Ameya Panchal"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    toc-location: left
    code-copy: true
    link-external-newwindow: true
    html-math-method: katex
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..700;1,400..700&display=swap">
      - assets/site/hero-head.html
    include-after-body:
      - assets/site/figure-zoom.html
      - assets/site/toc-rail.html
      - assets/site/hero-motion.html
      # The status stamp bails instantly on any page with no .hero-pulse, and
      # the rail introduction on any page with no TOC — so posts pay only the
      # parse for the first and the homepage only for the second.
      - assets/site/hero-status.html
      - assets/site/rail-intro.html
      # The interactive lens figure — bails on every page with no #ioi-lens.
      - assets/site/ioi-lens.html
