project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!design/"
  resources:
    - "assets/niche/"
    - "assets/pandas/"
    - "!assets/pandas/engine/node_modules/"

website:
  title: "Ameya Panchal"
  site-url: "https://ameya-bit.github.io"
  description: "Mechanistic interpretability and machine learning notes."
  search: false
  navbar:
    background: transparent
    title: "Ameya Panchal"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    toc-location: left
    code-copy: true
    link-external-newwindow: true
    html-math-method: katex
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
    include-after-body:
      - assets/site/figure-zoom.html
