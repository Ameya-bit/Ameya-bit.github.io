project:
  type: website
  output-dir: _site
  # The résumé page's body is generated from tools/resume/resume.toml on every
  # render, so the page can never drift from the source. (The PDF side runs
  # manually: python3 tools/resume/build.py --pdf.)
  pre-render: tools/resume/build.py
  # Figures get their intrinsic width/height and a load policy read out of the
  # image files themselves, after Quarto has written the HTML. Doing it here
  # rather than in the markdown means the numbers cannot drift from the files
  # they describe. (The WebP delivery copies are generated separately and
  # committed: python3 tools/site/figures.py)
  post-render:
    - tools/site/img-attrs.py
    # Accessibility repairs to Quarto's own chrome — nav landmark names and the
    # table scroll wrapper. Both found by the 2026-08-05 audit.
    - tools/site/landmarks.py
    # Quarto's own script fetches listings.json at a page-relative path; this
    # puts the real manifest at the address it actually asks for.
    - tools/site/listings-shim.py
    # Bootstrap Icons: 97 KB of render-blocking stylesheet and a 176 KB font,
    # for an icon set this site uses nowhere. Removed with a tripwire — the
    # step re-proves the set is unused on every render and fails the build
    # rather than serving a page a missing glyph.
    - tools/site/drop-icons.py
  render:
    - "**/*.qmd"
    - "!design/"
  resources:
    - "assets/niche/"
    - "assets/pandas/"
    - "!assets/pandas/engine/node_modules/"
    # The vendored KaTeX dist. Listed explicitly because the only reference to
    # it is in the script/link tags Quarto generates itself, which its resource
    # scanner does not follow.
    - "assets/katex/"
    # Video posters. The scanner follows <img src> and <video>'s <source src>,
    # but not a <video poster> — so a poster referenced only from that
    # attribute renders perfectly in preview and 404s in production, which is
    # the worst shape a bug can have. Named explicitly for the same reason
    # KaTeX is.
    - "notes/**/figures/*.webp"
    - "posts/**/figures/*.webp"

website:
  title: "Ameya Panchal"
  site-url: "https://ameya-bit.github.io"
  description: "Mechanistic interpretability and machine learning notes."
  # A standing panda, cel 0 of the `down` row of the hero sprite sheet, pulled
  # straight out of assets/pandas/engine/render/art-data.js and cropped to its
  # own bounds — nothing new had to be drawn. It was the same drawing as the
  # homepage troupe until that troupe was disabled (2026-08-03); the favicon
  # stays because it is a static cel — art, not motion — and it is now the only
  # panda visible anywhere on the site.
  favicon: assets/favicon.svg
  # Research circulates as links on X, LessWrong and the Alignment Forum. Without
  # these every share of these posts rendered as a bare URL: no title card, no
  # image, no author — while five publication-grade figures sat in each post
  # unable to be the preview. Every post declares `image:` in its front matter,
  # so post cards populate immediately.
  #
  # The homepage's own card closed 2026-08-06 (design/direction.md, open #5). It
  # is the site's cover recomposed for a 1200x630 frame, GENERATED rather than
  # drawn — tools/og-card/build.py reads the ramp and the type stack out of
  # styles.scss and renders with the committed Nunito, so the card cannot drift
  # into being a second design. Re-run it when the hero copy or the palette
  # changes; it is a deliberate step, not a render hook. This key is the DEFAULT,
  # so a post's own `image:` still wins on that post.
  #
  # LEADING SLASH, and it is load-bearing. Written bare, Quarto resolves this
  # per page rather than once for the site: the index got
  # `/assets/og-card.png` and every other page got `<its own dir>/assets/
  # og-card.png` — /about/assets/…, /colophon/assets/… — three 404s that no
  # crawler would have reported back. Site-absolute, every page names the one
  # file that exists.
  image: /assets/og-card.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search: false
  navbar:
    background: transparent
    title: "Ameya Panchal"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    # Table captions go under the table, where this site's figure captions
    # already are. Quarto's default puts them on top, which would make the two
    # kinds of float in a post read as two different conventions.
    tbl-cap-location: bottom
    toc-location: left
    code-copy: true
    link-external-newwindow: true
    # KaTeX is vendored, not fetched (2026-08-05). Quarto's default emits
    # `katex@latest` from a CDN, which is two problems wearing one script tag: a
    # floating version that can change the typesetting of every equation on this
    # site without a commit, and a third-party origin in the critical path of a
    # page whose math renders client-side. assets/katex/ holds a pinned 0.18.1
    # dist (js + css + woff2 subset of the fonts; VERSION records the pin).
    # Bump it the way the Quarto pin gets bumped — deliberately, with a local
    # render in the same commit.
    html-math-method:
      method: katex
      url: "/assets/katex/"
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..700;1,400..700&display=swap">
      - assets/site/hero-head.html
    include-after-body:
      - assets/site/figure-zoom.html
      - assets/site/toc-rail.html
      - assets/site/hero-motion.html
      # The status stamp bails instantly on any page with no .hero-pulse, and
      # the rail introduction on any page with no TOC — so posts pay only the
      # parse for the first and the homepage only for the second.
      - assets/site/hero-status.html
      - assets/site/rail-intro.html
      # The interactive lens figure — bails on every page with no #ioi-lens.
      - assets/site/ioi-lens.html
      # Looping video figures: in-view autoplay, so a reader who never scrolls
      # to one never downloads it. Bails on every page with no .loop-figure.
      - assets/site/loop-figure.html
      # Wide equations and tables become keyboard-reachable while they scroll.
      - assets/site/scroll-boxes.html
