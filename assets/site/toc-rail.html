<!--
  TOC rail geometry — inlined into every page via `include-after-body` in
  _quarto.yml. All styling lives in styles.scss ("The rail's words exist only on
  request" + the marks rules); this file only measures and writes numbers.

  THE RAIL IS AN INSTRUMENT, not a list (2026-08-03): at rest it is a stacked
  column of 2px bars and nothing else, scaled so bars plus equal gaps span
  HALF THE VIEWPORT HEIGHT, vertically centred by the sticky box. Each bar's
  LENGTH is its section's share of the document; each bar FILLS with ink as
  the reader moves through it — completed sections solid, the current one
  part-filled, the rest gray. Shape says what the document is; ink says where
  you are in it. Labels exist only on hover or keyboard focus (pure CSS,
  styles.scss), centred on their bars.

  This file writes two custom properties per top-level TOC item, plus one on
  the root:

    --mark-h     the bar's height   (section share × the half-viewport
                 column, floored at 0.824rem so short sections stay visible)
    --mark-fill  the bar's fill     (0–100%, fraction of the section behind
                 the reader's position)
    --rail-h     (on <html>) the column's total height, which the sticky box
                 uses to centre it — on the root because quarto.js rewrites
                 the sidebar's own style attribute on scroll

  The fill is written on scroll through one passive rAF-coalesced listener. It
  is STATE, not animation — it tracks the scroll position exactly the way the
  scrollbar thumb does, with no transition — so prefers-reduced-motion has
  nothing to disable.

  HISTORY: this file used to run a scroll-direction state machine
  (data-toc full/sunk, 24px hysteresis, staggered collapse). Ameya retired it:
  once the resting rail never contains text, direction has nothing to decide.
  The full design and its timings are preserved in design/direction.md.

  The reader line: a section counts as "being read" from the moment its top
  passes 30% of the viewport height. The last pixels of the document can never
  pass that line, so the fill is additionally pinned to 100% at the scroll
  floor — a document read to the end shows a fully inked rail.

  Bails out on pages with no TOC, so the homepage pays nothing but the parse.
-->
<script>
  (() => {
    const items = document.querySelectorAll("#TOC > ul > li");
    if (!items.length) return;
    const sections = document.querySelectorAll("main.content section.level2");
    // If the TOC and the sections ever disagree in count, leave the uniform
    // 12px fallback marks rather than guess a mapping. (Nested h3 lists do not
    // affect this — both counts are h2-level.)
    if (sections.length !== items.length) return;

    let tops = [];
    let bottoms = [];

    // ---- Bar heights: the column is half the viewport ----------------------
    // Each bar's share of the column is its section's share of the document,
    // the gaps between bars are equal (0.706rem, matching the CSS
    // margin-bottom), and bars + gaps together span 50% of the viewport
    // height. The floor keeps a two-paragraph section visible and hoverable —
    // and, with the 0.706rem gap, keeps adjacent hover labels (~25px tall,
    // centred on their bars) from colliding even when two short sections sit
    // together. The total is written to <html> as `--rail-h` so the sticky
    // box can centre the column vertically; it goes on the root because
    // quarto.js rewrites the sidebar's own style attribute on scroll.
    const measure = () => {
      const rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
      const GAP = 0.706 * rootPx; // 12px at calibration — must match the CSS
      const FLOOR = 0.824 * rootPx; // 14px at calibration
      const y = window.scrollY;
      tops = Array.from(sections, (s) => s.getBoundingClientRect().top + y);
      bottoms = Array.from(sections, (s, i) => tops[i] + s.offsetHeight);
      const lengths = sections.length
        ? Array.from(sections, (s) => s.offsetHeight)
        : [];
      const sum = lengths.reduce((a, b) => a + b, 0);
      const target = window.innerHeight * 0.5 - GAP * (lengths.length - 1);
      let railH = GAP * (lengths.length - 1);
      items.forEach((li, i) => {
        const h = Math.round(Math.max(FLOOR, (lengths[i] / sum) * target));
        li.style.setProperty("--mark-h", h + "px");
        railH += h;
      });
      document.documentElement.style.setProperty("--rail-h", railH + "px");
      fill();
    };

    // ---- Fill: ink up to the reader's position ------------------------------
    const fill = () => {
      const y = window.scrollY;
      const atFloor = y >= document.documentElement.scrollHeight - window.innerHeight - 2;
      const reader = y + window.innerHeight * 0.3;
      items.forEach((li, i) => {
        const f = atFloor
          ? 1
          : Math.min(1, Math.max(0, (reader - tops[i]) / (bottoms[i] - tops[i])));
        li.style.setProperty("--mark-fill", (f * 100).toFixed(1) + "%");
      });
    };

    let ticking = false;
    window.addEventListener(
      "scroll",
      () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          ticking = false;
          fill();
        });
      },
      { passive: true }
    );

    let raf = 0;
    const remeasure = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(measure);
    };
    // Load settles the images (section heights move as they arrive); resize
    // changes the fluid root and with it every length on the page.
    window.addEventListener("load", remeasure);
    window.addEventListener("resize", remeasure, { passive: true });
    measure();
  })();
</script>
