<!--
  TOC rail geometry — inlined into every page via `include-after-body` in
  _quarto.yml. All styling lives in styles.scss ("The rail's words exist only on
  request" + the marks rules); this file only measures and writes numbers.

  THE RAIL IS AN INSTRUMENT, not a list (2026-08-03): at rest it is six
  hairline bars and nothing else. Each bar's LENGTH is its section's rendered
  length — a small bar chart of the document — and each bar FILLS with ink as
  the reader moves through that section, so completed sections are solid,
  the current one is part-filled, and what remains waits in gray. Shape says
  what the document is; ink says where you are in it. Labels exist only on
  hover or keyboard focus (pure CSS, styles.scss).

  This file writes two custom properties per top-level TOC item:

    --mark-h     the bar's height   (section length, scaled; 8–28px at the
                 17px calibration root, rem-scaled via the live root)
    --mark-fill  the bar's fill     (0–100%, fraction of the section behind
                 the reader's position)

  The fill is written on scroll through one passive rAF-coalesced listener. It
  is STATE, not animation — it tracks the scroll position exactly the way the
  scrollbar thumb does, with no transition — so prefers-reduced-motion has
  nothing to disable.

  HISTORY: this file used to run a scroll-direction state machine
  (data-toc full/sunk, 24px hysteresis, staggered collapse). Ameya retired it:
  once the resting rail never contains text, direction has nothing to decide.
  The full design and its timings are preserved in design/direction.md.

  The reader line: a section counts as "being read" from the moment its top
  passes 30% of the viewport height. The last pixels of the document can never
  pass that line, so the fill is additionally pinned to 100% at the scroll
  floor — a document read to the end shows a fully inked rail.

  Bails out on pages with no TOC, so the homepage pays nothing but the parse.
-->
<script>
  (() => {
    const items = document.querySelectorAll("#TOC > ul > li");
    if (!items.length) return;
    const sections = document.querySelectorAll("main.content section.level2");
    // If the TOC and the sections ever disagree in count, leave the uniform
    // 12px fallback marks rather than guess a mapping. (Nested h3 lists do not
    // affect this — both counts are h2-level.)
    if (sections.length !== items.length) return;

    let tops = [];
    let bottoms = [];

    // ---- Bar heights: mark length = section length -------------------------
    // Bounds are stated in rem so the chart scales with the fluid root. The
    // floor exists because a two-paragraph section still needs a visible,
    // hoverable bar; the ceiling keeps the tallest bar clear of its
    // neighbours on the rail's 0.5rem-spaced pitch.
    const measure = () => {
      const rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
      const MAX = 1.647 * rootPx; // 28px at calibration
      const MIN = 0.471 * rootPx; // 8px at calibration
      const y = window.scrollY;
      tops = Array.from(sections, (s) => s.getBoundingClientRect().top + y);
      bottoms = Array.from(sections, (s, i) => tops[i] + s.offsetHeight);
      const longest = Math.max(...Array.from(sections, (s) => s.offsetHeight));
      items.forEach((li, i) => {
        const h = Math.round(Math.max(MIN, ((bottoms[i] - tops[i]) / longest) * MAX));
        li.style.setProperty("--mark-h", h + "px");
      });
      fill();
    };

    // ---- Fill: ink up to the reader's position ------------------------------
    const fill = () => {
      const y = window.scrollY;
      const atFloor = y >= document.documentElement.scrollHeight - window.innerHeight - 2;
      const reader = y + window.innerHeight * 0.3;
      items.forEach((li, i) => {
        const f = atFloor
          ? 1
          : Math.min(1, Math.max(0, (reader - tops[i]) / (bottoms[i] - tops[i])));
        li.style.setProperty("--mark-fill", (f * 100).toFixed(1) + "%");
      });
    };

    let ticking = false;
    window.addEventListener(
      "scroll",
      () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          ticking = false;
          fill();
        });
      },
      { passive: true }
    );

    let raf = 0;
    const remeasure = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(measure);
    };
    // Load settles the images (section heights move as they arrive); resize
    // changes the fluid root and with it every length on the page.
    window.addEventListener("load", remeasure);
    window.addEventListener("resize", remeasure, { passive: true });
    measure();
  })();
</script>
