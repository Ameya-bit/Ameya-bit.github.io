<!-- The lens figure (2026-08-04) — the site's first interactive figure.
     Inlined via `include-after-body`; bails immediately on every page that
     does not contain one, so the rest of the site pays a querySelector.

     WHAT IT IS. The IOI post's closing argument is that direct logit
     attribution and activation patching, run on the same hundred prompts,
     disagree about exactly one head — L8H6, which DLA ranks 138th of 144 and
     patching makes the brightest cell on its grid. The static version of that
     claim is a scatter plot: the disagreement is a point that sits away from
     the diagonal, which the reader has to be *told* to look at. Here the two
     measurements share one grid and the reader switches the lens, so the same
     object visibly changes — 8.6 goes from invisible to loudest under the
     reader's own hand. The argument stops being a caption.

     WHY THE READOUT ALWAYS SHOWS BOTH NUMBERS. A toggle that only ever showed
     the active lens would make the flip a colour trick. Naming both values,
     with DLA's rank among all 144 heads, is what turns it into a comparison.

     WHY EACH LENS IS SCALED TO ITSELF. The two carry different units — logit
     difference against normalised recovery — so there is no honest shared
     scale. Each normalises to its own largest magnitude, and the caption says
     so, because a reader who assumed a shared scale would read the flip as a
     magnitude change rather than a change of instrument.

     STRUCTURE. Data is a generated JSON block (figures/make_lens_data.py, from
     the same _data.npz plot.py uses — no typed numbers). Styling is in
     styles.scss, per the site's rule that scripts compute and stylesheets
     style. This file builds the DOM and owns interaction only.

     ACCESSIBILITY. The grid is one tab stop with a roving selection driven by
     the arrow keys, not 48 tab stops. Cells are gridcells with per-cell
     aria-labels; the readout is aria-live so a lens change or a new selection
     is announced. With JS off the markup's <noscript> keeps the static scatter,
     so the argument still lands.

     MOTION. None. Colour and selection change instantly, exactly like every
     other hover on this site — this is an answer to a request, and requests
     are never answered on a curve. prefers-reduced-motion has nothing to do. -->
<script>
  (function () {
    "use strict";
    var root = document.getElementById("ioi-lens");
    var raw = document.getElementById("ioi-lens-data");
    if (!root || !raw) return;

    var D;
    try {
      D = JSON.parse(raw.textContent);
    } catch (e) {
      return; // leave the noscript fallback's static figure in place
    }
    if (!D || !D.cells || !D.cells.length) return;

    var LENSES = ["dla", "patch"];
    var lens = "dla";
    var sel = D.cells.find(function (c) { return c.l === 8 && c.h === 6; }) || D.cells[0];

    // The figure palette, verbatim from design/figures.mplstyle and plot.py:
    // vermillion positive, Okabe-Ito blue negative, the page colour at zero.
    // Figures are the one place this site spends colour at rest — the
    // monochrome-until-interaction rule governs page chrome, not artwork, and
    // these are the same two inks the static figures already use.
    var POS = [213, 94, 0];
    var NEG = [0, 114, 178];
    var PAGE = [238, 236, 230];

    function mix(a, b, t) {
      return "rgb(" + a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }).join(",") + ")";
    }

    function value(c) { return lens === "dla" ? c.dla : c.patch; }

    function shade(c) {
      var max = D.lenses[lens].max || 1;
      var t = Math.min(1, Math.abs(value(c)) / max);
      return mix(PAGE, value(c) < 0 ? NEG : POS, t);
    }

    function fmt(v) {
      return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
    }

    function name(c) { return "L" + c.l + "H" + c.h; }

    // ---- DOM -------------------------------------------------------------
    var toggle = document.createElement("div");
    toggle.className = "lens-toggle";
    toggle.setAttribute("role", "group");
    toggle.setAttribute("aria-label", "Measurement lens");

    var buttons = LENSES.map(function (key) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = D.lenses[key].label;
      b.addEventListener("click", function () { setLens(key); });
      toggle.appendChild(b);
      return { key: key, el: b };
    });

    var grid = document.createElement("div");
    grid.className = "lens-grid";
    grid.setAttribute("role", "grid");
    grid.setAttribute("aria-label", "Attention heads, layers " + D.layers[0] + " to " + D.layers[D.layers.length - 1]);
    grid.tabIndex = 0;

    var cellEls = new Map();
    // Layers descend down the page (11 at the top), matching the static
    // figures' origin-lower orientation so the two are readable together.
    D.layers.slice().reverse().forEach(function (layer) {
      var row = document.createElement("div");
      row.className = "lens-row";
      row.setAttribute("role", "row");

      var head = document.createElement("span");
      head.className = "lens-rowhead";
      head.setAttribute("role", "rowheader");
      head.textContent = "L" + layer;
      row.appendChild(head);

      D.heads.forEach(function (h) {
        var c = D.cells.find(function (x) { return x.l === layer && x.h === h; });
        var el = document.createElement("span");
        el.className = "lens-cell";
        el.setAttribute("role", "gridcell");
        if (c.role) el.classList.add("is-named");
        el.addEventListener("mouseenter", function () { select(c); });
        el.addEventListener("click", function () { select(c); grid.focus(); });
        cellEls.set(name(c), el);
        row.appendChild(el);
      });
      grid.appendChild(row);
    });

    var axis = document.createElement("div");
    axis.className = "lens-axis";
    axis.appendChild(document.createElement("span")); // spacer over the row heads
    D.heads.forEach(function (h) {
      var s = document.createElement("span");
      s.textContent = h;
      axis.appendChild(s);
    });

    var readout = document.createElement("p");
    readout.className = "lens-readout";
    readout.setAttribute("aria-live", "polite");

    var scale = document.createElement("p");
    scale.className = "lens-scale";

    root.appendChild(toggle);
    root.appendChild(grid);
    root.appendChild(axis);
    root.appendChild(readout);
    root.appendChild(scale);

    // ---- Render ----------------------------------------------------------
    function paint() {
      D.cells.forEach(function (c) {
        var el = cellEls.get(name(c));
        el.style.background = shade(c);
        el.classList.toggle("is-sel", c === sel);
        el.setAttribute(
          "aria-label",
          name(c) + (c.role ? ", " + c.role : "") +
            ", " + D.lenses[lens].label + " " + fmt(value(c))
        );
      });

      buttons.forEach(function (b) {
        b.el.setAttribute("aria-pressed", String(b.key === lens));
        b.el.classList.toggle("is-on", b.key === lens);
      });

      // Both numbers, always — the comparison is the point.
      readout.innerHTML = "";
      var strong = document.createElement("strong");
      strong.textContent = name(sel);
      readout.appendChild(strong);
      var rest =
        (sel.role ? " · " + sel.role : "") +
        " · DLA " + fmt(sel.dla) + " (" + ordinal(sel.rank) + " of " + D.nHeadsTotal + ")" +
        " · patching " + fmt(sel.patch);
      readout.appendChild(document.createTextNode(rest));

      scale.textContent =
        D.lenses[lens].unit + " · scaled to this lens' own maximum, " +
        D.lenses[lens].max.toFixed(2) + " · the two lenses are not on one scale";
    }

    function ordinal(n) {
      var s = ["th", "st", "nd", "rd"];
      var v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function select(c) {
      if (!c || c === sel) return;
      sel = c;
      paint();
    }

    function setLens(key) {
      if (key === lens) return;
      lens = key;
      paint();
    }

    // ---- Keyboard --------------------------------------------------------
    // One tab stop, arrows move the selection, Enter/Space flips the lens —
    // so the whole argument is reachable without a pointer.
    grid.addEventListener("keydown", function (e) {
      var dl = 0, dh = 0;
      if (e.key === "ArrowLeft") dh = -1;
      else if (e.key === "ArrowRight") dh = 1;
      else if (e.key === "ArrowUp") dl = 1;
      else if (e.key === "ArrowDown") dl = -1;
      else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        setLens(lens === "dla" ? "patch" : "dla");
        return;
      } else return;

      e.preventDefault();
      var l = Math.min(D.layers[D.layers.length - 1], Math.max(D.layers[0], sel.l + dl));
      var h = Math.min(D.heads[D.heads.length - 1], Math.max(0, sel.h + dh));
      select(D.cells.find(function (c) { return c.l === l && c.h === h; }));
    });

    root.hidden = false;
    paint();
  })();
</script>
